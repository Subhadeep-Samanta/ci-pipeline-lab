
name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Hub Secrets
        run: |
          if [ -z "$DOCKERHUB_USER" ]; then
            echo "DOCKERHUB_USER secret is missing"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN secret is missing"
            exit 1
          fi

          echo "Docker Hub secrets are available"
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/app:${{ github.sha }}

  deploy:
    name: Deploy and Verify
    runs-on: ubuntu-latest
    needs: build

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USER }}/app:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Published Image
        run: docker compose pull

      - name: Deploy with Docker Compose
        run: docker compose up -d --no-build

      - name: Verify Application Health
        run: |
          echo "Checking application health..."

          curl --fail \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 2 \
            http://localhost:8080/health

          echo ""
          echo "Deployment successful!"

      - name: Show Running Containers
        run: docker compose ps
