
name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Hub Secrets
        run: |
          if [ -z "$DOCKERHUB_USER" ]; then
            echo "DOCKERHUB_USER secret is missing"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN secret is missing"
            exit 1
          fi

          echo "Docker Hub secrets are available"
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/app:${{ github.sha }}

  deploy:
    name: Deploy and Verify
    runs-on: ubuntu-latest
    needs: build

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USER }}/app:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Published Image
        run: docker compose pull app

      - name: Deploy with Docker Compose
        run: docker compose up -d --no-build

      - name: Wait for Application Health
        run: |
          echo "Waiting for application to become available..."

          for i in {1..15}; do
            if curl --silent --show-error --fail \
              http://localhost:8080/health; then
              echo ""
              echo "Application is healthy!"
              exit 0
            fi

            echo "Attempt $i failed. Retrying in 3 seconds..."
            sleep 3
          done

          echo "Health check failed after 15 attempts."
          exit 1

      - name: Show Deployment Status
        if: always()
        run: |
          echo "Container status:"
          docker compose ps -a

          echo "Application logs:"
          docker compose logs --no-color app